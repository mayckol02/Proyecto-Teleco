spring.application.name=maintenance-service
server.port=8083

# H2 Database (in-memory for simplicity in Azure)
spring.datasource.url=jdbc:h2:mem:maintenancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Notification Service URL
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8090}

# Logging
logging.level.com.proyectoTeleco.maintenance=INFO
